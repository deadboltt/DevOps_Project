services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: gitops-microservice:local
    container_name: gitops-microservice
    ports:
      - "8000:3000"
    environment:
      - PORT=3000
      - ENVIRONMENT=local-dev
      - APP_VERSION=1.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
