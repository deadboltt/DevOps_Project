name: Cloud-Native CI & DevSecOps Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: write
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Automated Unit & Health Testing
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Run Unit Tests & Probe Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Dependencies
        run: npm ci --prefix app

      - name: Execute Jest Test Suite
        run: npm test --prefix app

  # ---------------------------------------------------------------------------
  # Job 2: DevSecOps Vulnerability Auditing (Aqua Security Trivy)
  # ---------------------------------------------------------------------------
  security-scan:
    name: Trivy Security & Vulnerability Scan
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner (Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Non-blocking in dev; set to 1 for hard production gate

  # ---------------------------------------------------------------------------
  # Job 3: Multi-Stage Docker Build & Push to GitHub Container Registry (GHCR)
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Publish OCI Container Image
    needs: [unit-tests, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Convert Repository Name to Lowercase
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Job 4: GitOps Bridge — Update Image Tag in Kubernetes Manifests
  # ---------------------------------------------------------------------------
  update-gitops-manifest:
    name: Update GitOps Deployment Manifest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Deployment Image Tag with Git Commit SHA
        run: |
          IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-7)
          echo "Updating deployment.yaml to image tag: $SHORT_SHA"
          
          # Replace the image line in k8s/deployment.yaml
          sed -i -E "s|image: ghcr.io/[^:]+:[^ ]+|image: ghcr.io/$IMAGE_NAME:$SHORT_SHA|g" k8s/deployment.yaml
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          
          # Commit only if changes exist, with [skip ci] to avoid recursive pipeline trigger
          if git diff --staged --quiet; then
            echo "No manifest changes to commit."
          else
            git commit -m "ci(gitops): update deployment image to $SHORT_SHA [skip ci]"
            git push origin master
          fi

